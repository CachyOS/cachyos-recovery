[Distribution]
Distribution=arch
Architecture=x86-64

[Output]
Format=uki
ImageId=cachyos-recovery
CompressOutput=xz
CompressLevel=9

[Content]
Bootable=no
Bootloader=none
MakeInitrd=yes
Timezone=UTC
Locale=C.UTF-8
WithDocs=no
CleanPackageMetadata=yes
Keymap=us
Hostname=cachyos-recovery
Packages=
    attr
    bash
    btrfs-progs
    coreutils
    cryptsetup
    findutils
    fzf
    gawk
    grep
    kexec-tools
    kmod
    kmscon
    linux-firmware-amd
    linux-lts
    ncurses
    pango
    sed
    systemd
    ttf-dejavu
    util-linux

RemoveFiles=
    /etc/ca-certificates
    /etc/ssl/
    /usr/bin/sqlite*
    /usr/include
    /usr/lib/**/*.a
    /usr/lib/cmake
    /usr/lib/gconv/
    /usr/lib/gio
    /usr/lib/gio-launch-desktop
    /usr/lib/glib-2.0
    /usr/lib/kmscon/mod-drm3d.so
    /usr/lib/kmscon/mod-gltex.so
    /usr/lib/libgfortran.so*
    /usr/lib/libicu*.so*
    /usr/lib/libleancrypto*
    /usr/lib/libxml2.so*
    /usr/lib/modules/*/system.map
    /usr/lib/modules/*/vmlinux*
    /usr/lib/modules/*/vmlinuz*
    /usr/lib/pkgconfig
    /usr/lib/python*/
    /usr/lib/systemd/boot
    /usr/lib/systemd/systemd-homed
    /usr/lib/systemd/systemd-homework
    /usr/lib/systemd/systemd-nsresourced
    /usr/lib/udev/hwdb.d
    /usr/share/audit-rules
    /usr/share/bash-completion
    /usr/share/file
    /usr/share/gir-1.0
    /usr/share/glib-2.0
    /usr/share/hwdata
    /usr/share/i18n
    /usr/share/iana-etc
    /usr/share/include
    /usr/share/libalpm
    /usr/share/licenses
    /usr/share/locale
    /usr/share/pkgconfig
    /usr/share/vim
    /usr/share/zoneinfo
    /usr/share/zsh

KernelModules=
    /fs/nls/
    ahci
    ata/
    atkbd
    btrfs
    crypto/
    dm-crypt
    dm-mod
    evdev
    ext4
    f2fs
    hid-generic
    i2c-designware-pci
    i2c-designware-platform
    i2c_hid_acpi
    i8042
    intel-lpss-acpi
    intel-lpss-pci
    mmc_block
    nvme
    overlay
    scsi_mod
    sd_mod
    sdhci-acpi
    sdhci-pci
    serio
    sr_mod
    uas
    usb-storage
    usbhid
    vfat
    virtio_blk
    virtio_console
    virtio_pci
    virtio_scsi
    vmd
    xfs

KernelCommandLine=rd.systemd.unit=cachyos-recovery.target quiet
