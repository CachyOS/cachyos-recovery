[Distribution]
Distribution=arch
Architecture=x86-64

[Output]
Format=uki
ImageId=cachyos-recovery
CompressLevel=22

[Content]
Bootable=no
Bootloader=none
MakeInitrd=yes
Timezone=UTC
Locale=C.UTF-8
Keymap=us
Hostname=cachyos-recovery
Packages=
    amd-ucode
    bash
    btrfs-progs
    coreutils
    cryptsetup
    findutils
    fzf
    gawk
    grep
    intel-ucode
    kexec-tools
    kmod
    kmscon
    linux-firmware-amd
    linux-lts
    ncurses
    fontconfig
    sed
    systemd
    ttf-dejavu
    util-linux

RemoveFiles=
    /etc/ca-certificates
    /etc/ssl/
    /usr/bin/sqlite*
    /usr/include
    /usr/lib/**/*.a
    /usr/lib/cmake
    /usr/lib/gconv/
    /usr/lib/libgfortran.so*
    /usr/lib/libicu*.so*
    /usr/lib/libleancrypto*
    /usr/lib/libxml2.so*
    /usr/lib/pkgconfig
    /usr/lib/python*/
    /usr/lib/systemd/boot
    /usr/lib/systemd/boot
    /usr/lib/systemd/systemd-homed
    /usr/lib/systemd/systemd-homework
    /usr/lib/systemd/systemd-nsresourced
    /usr/lib/udev/hwdb.d
    /usr/share/audit-rules
    /usr/share/bash-completion
    /usr/share/doc
    /usr/share/file
    /usr/share/fonts/TTF/DejaVuMathTeXGyre.ttf
    /usr/share/fonts/TTF/DejaVuSans-Bold.ttf
    /usr/share/fonts/TTF/DejaVuSans-BoldOblique.ttf
    /usr/share/fonts/TTF/DejaVuSans-ExtraLight.ttf
    /usr/share/fonts/TTF/DejaVuSans-Oblique.ttf
    /usr/share/fonts/TTF/DejaVuSans.ttf
    /usr/share/fonts/TTF/DejaVuSansCondensed-Bold.ttf
    /usr/share/fonts/TTF/DejaVuSansCondensed-BoldOblique.ttf
    /usr/share/fonts/TTF/DejaVuSansCondensed-Oblique.ttf
    /usr/share/fonts/TTF/DejaVuSansCondensed.ttf
    /usr/share/fonts/TTF/DejaVuSerif-Bold.ttf
    /usr/share/fonts/TTF/DejaVuSerif-BoldItalic.ttf
    /usr/share/fonts/TTF/DejaVuSerif-Italic.ttf
    /usr/share/fonts/TTF/DejaVuSerif.ttf
    /usr/share/fonts/TTF/DejaVuSerifCondensed-Bold.ttf
    /usr/share/fonts/TTF/DejaVuSerifCondensed-BoldItalic.ttf
    /usr/share/fonts/TTF/DejaVuSerifCondensed-Italic.ttf
    /usr/share/fonts/TTF/DejaVuSerifCondensed.ttf
    /usr/share/gir-1.0
    /usr/share/gtk-doc
    /usr/share/hwdata
    /usr/share/i18n
    /usr/share/iana-etc
    /usr/share/include
    /usr/share/info
    /usr/share/libalpm
    /usr/share/licenses
    /usr/share/locale
    /usr/share/man
    /usr/share/pkgconfig
    /usr/share/terminfo
    /usr/share/vim
    /usr/share/zoneinfo
    /usr/share/zsh
    /var/lib/pacman

KernelModules=
    acpi/
    ata/
    block/
    crypto/
    scsi/
    dm-.*
    fs/
    hid/
    input/keyboard/
    input/serio/
    nvme/
    tpm/
    usb/
    virtio

KernelInitrdModules=default
KernelCommandLine=rd.systemd.unit=cachyos-recovery.target
