name: Release

on:
  release:
    types: [ published ]
  push:
    tags:
      - '*.*.*'

concurrency:
  group: ${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yml

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Clone
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Fetch tags
      id: fetch
      shell: bash
      run: |
        git fetch origin +refs/tags/*:refs/tags/*

    - name: Create release
      id: create
      shell: bash
      run: >-
        gh
        release create
        ${{ github.ref_name }}
        --latest
        --title "${{ github.ref_name }}"
        --verify-tag
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  upload:
    name: Upload images
    runs-on: ubuntu-latest
    needs: release
    steps:
      - name: Download images
        id: download
        uses: actions/download-artifact@v8
        with:
          path: /tmp/images
          merge-multiple: true

      - name: Upload mkosi images to release
        shell: bash
        run: >-
          gh
          --repo "${{ github.server_url }}/${{ github.repository }}"
          release upload
          ${{ github.ref_name }}
          /tmp/images/*
          --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
